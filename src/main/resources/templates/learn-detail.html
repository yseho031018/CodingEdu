<!DOCTYPE html>
<html lang="ko" data-theme="light" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <script>(function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <meta th:name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta th:name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}"/>
    <title th:text="${langTitle + ' - CodeEdu'}">학습하기 - CodeEdu</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/tailwind.css">
    <link rel="stylesheet" href="/css/design-refresh.css">
    <style>
        /* ── 전체 레이아웃 ── */
        .learn-wrap {
            display: flex;
            min-height: calc(100vh - 64px);
        }

        /* ── 사이드바 ── */
        .sidebar {
            width: 260px;
            flex-shrink: 0;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-card);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 64px;
            height: calc(100vh - 64px);
            overflow-y: auto;
        }
        /* 토픽 목록 – 나머지 공간 전부 */
        .sidebar-topics {
            padding: 8px 0;
            flex: 1;
            overflow-y: auto;
        }
        .topics-label {
            font-size: .7rem;
            font-weight: 700;
            color: var(--ink-3);
            padding: 4px 16px 8px;
            letter-spacing: .05em;
            text-transform: uppercase;
        }
        .topic-item {
            display: block;
            padding: 8px 16px;
            font-size: .855rem;
            color: var(--ink-2);
            text-decoration: none;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all .15s;
            line-height: 1.4;
        }
        .topic-item:hover { background: var(--bg); color: var(--ink-1); }
        .topic-item.active {
            background: var(--accent-soft);
            color: var(--accent);
            border-left-color: var(--accent);
            font-weight: 700;
        }
        .topic-item.done { color: var(--success); }
        .topic-item.done .topic-label { text-decoration: line-through; opacity: .7; }
        .topic-item.done.active { color: var(--accent); }
        .topic-item.done.active .topic-label { text-decoration: none; opacity: 1; }
        .topic-check {
            width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: .7rem; font-weight: 900;
        }
        .topic-check.checked { background: var(--success); color: #fff; }
        .topic-check.unchecked { display: none; }
        .topic-item.sub {
            padding-left: 28px;
            font-size: .8rem;
            color: var(--ink-3);
        }
        .topic-item.sub.active { color: var(--accent); }

        /* ── 메인 콘텐츠 ── */
        .main-content {
            flex: 1;
            padding: 48px 64px;
            background: var(--bg-surface);
            max-width: 860px;
        }

        .lesson-meta {
            font-size: .85rem;
            color: var(--accent);
            margin-bottom: 6px;
        }
        .lesson-main-title {
            font-size: 2rem;
            font-weight: 900;
            color: var(--ink-1);
            margin-bottom: 12px;
            line-height: 1.3;
        }
        .lesson-date {
            font-size: .82rem;
            color: var(--ink-3);
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        .lesson-date span { color: var(--accent); margin-left: 8px; }

        /* 동영상 영역 */
        .video-wrap {
            background: var(--ink-1);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 36px;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .video-thumb-bg {
            position: absolute; inset: 0;
            background: linear-gradient(135deg, var(--ink-1) 0%, var(--accent-h) 100%);
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 12px;
        }
        .video-thumb-icon { font-size: 4rem; opacity: .4; }
        .video-thumb-title { font-size: 1rem; color: rgba(255,255,255,.6); font-weight: 600; }

        .play-btn {
            position: absolute;
            width: 72px; height: 72px;
            background: var(--danger); border-radius: 16px; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 2;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: transform .2s;
        }
        .play-btn:hover { transform: scale(1.1); }
        .play-btn::after {
            content: ''; width: 0; height: 0;
            border-top: 14px solid transparent;
            border-bottom: 14px solid transparent;
            border-left: 24px solid #fff;
            margin-left: 4px;
        }

        /* 본문 */
        .lesson-body { font-size: .975rem; color: var(--ink-1); line-height: 1.9; }
        .lesson-body h3 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--ink-1);
            margin: 36px 0 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border);
        }
        .lesson-body p { margin-bottom: 16px; }
        .lesson-body ul { padding-left: 20px; margin-bottom: 16px; }
        .lesson-body li { margin-bottom: 8px; }

        .code-block {
            background: var(--ink-1);
            border-radius: 12px;
            padding: 20px 24px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: .875rem;
            color: #69FF47;
            line-height: 1.8;
            overflow-x: auto;
            white-space: pre;
            margin: 16px 0 24px;
        }
        .code-label {
            font-size: .78rem;
            font-weight: 700;
            color: var(--ink-3);
            margin-bottom: 6px;
            margin-top: 20px;
        }

        .lesson-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 56px;
            padding-top: 28px;
            border-top: 1px solid var(--border);
            gap: 12px;
        }
        .nav-btn {
            flex: 1;
            padding: 14px 20px;
            border-radius: 12px;
            border: 2px solid var(--border-card);
            background: var(--bg-surface);
            cursor: pointer;
            font-size: .9rem;
            font-weight: 700;
            color: var(--ink-2);
            transition: all .2s;
            text-align: center;
        }
        .nav-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
        .nav-btn.next { background: var(--accent); color: #fff; border-color: var(--accent); }
        .nav-btn.next:hover { background: var(--accent-h); }
        @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.4)} 50%{box-shadow:0 0 0 8px rgba(16,185,129,0)} }
        .nav-btn.pulse { animation: pulse 1.2s infinite; }
        .nav-btn:disabled { opacity: .35; cursor: not-allowed; }
        .nav-btn:disabled:hover { border-color: var(--border-card); color: var(--ink-2); background: var(--bg-surface); }

        /* ── 모바일 ── */
        .sidebar-toggle {
            display: none;
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 200;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(16,185,129,.4);
        }
        .note-panel {
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            flex-shrink: 0;
            background: var(--bg-surface);
        }
        .note-title {
            font-size: .75rem;
            font-weight: 700;
            color: var(--ink-3);
            margin-bottom: 6px;
            letter-spacing: .05em;
            text-transform: uppercase;
        }
        .note-area {
            width: 100%;
            height: 110px;
            border: 1.5px solid var(--border-card);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: .82rem;
            resize: vertical;
            font-family: inherit;
            line-height: 1.5;
            color: var(--ink-1);
        }
        .note-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            gap: 12px;
        }
        .note-status {
            font-size: .72rem;
            color: var(--ink-3);
        }
        .note-save-btn {
            padding: 5px 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: .78rem;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }
        /* 모바일 대응 코드 */
        @media (max-width: 900px) {
            .sidebar {
                position: fixed;
                top: 64px;
                left: -260px;
                z-index: 100;
                transition: left .25s;
                height: calc(100vh - 64px);
            }
            .sidebar.open { left: 0; }
            .sidebar-toggle { display: flex; align-items: center; justify-content: center; }
            .main-content { padding: 32px 24px; }
            .note-panel {
                padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            }
            .note-area {
                min-height: 96px;
                max-height: 28vh;
            }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ── 강의 상세 작업 공간 ── */
        body.page-lesson-detail {
            min-width: 0;
            background: #f7f8fc;
            overflow-x: hidden;
        }
        .page-lesson-detail .learn-wrap {
            width: 100%;
            max-width: none;
            min-height: 100vh !important;
            margin: 0;
            display: grid !important;
            grid-template-columns: 270px minmax(0, 1fr) 340px !important;
            background: var(--bg-surface);
            border: 0;
            border-radius: 0;
            overflow: visible;
        }
        .page-lesson-detail .sidebar {
            position: sticky;
            top: 0 !important;
            width: auto !important;
            height: 100vh !important;
            padding: 0;
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            border-top-right-radius: 32px;
            box-shadow: 12px 0 32px rgba(28, 39, 68, .04);
            overflow: hidden;
        }
        .lesson-brand {
            min-height: 72px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--ink-1);
            border-bottom: 1px solid var(--border);
            font-size: 1.2rem;
            font-weight: 850;
            text-decoration: none;
        }
        .lesson-brand em { color: var(--accent); font-style: normal; }
        .lesson-brand-mark {
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            font-size: .68rem;
        }
        .lesson-course-summary {
            padding: 23px 22px 20px;
            border-bottom: 1px solid var(--border);
        }
        .lesson-course-summary strong {
            display: block;
            margin-bottom: 13px;
            color: var(--ink-1);
            font-size: 1rem;
            line-height: 1.45;
        }
        .lesson-course-progress-copy {
            margin-bottom: 7px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: var(--ink-3);
            font-size: .76rem;
            font-weight: 700;
        }
        .lesson-course-progress {
            height: 4px;
            overflow: hidden;
            background: #edf0f5;
            border-radius: 5px;
        }
        .lesson-course-progress i {
            width: 0;
            height: 100%;
            display: block;
            background: #28c888;
            border-radius: inherit;
            transition: width .25s;
        }
        .page-lesson-detail .sidebar-topics {
            padding: 18px 0 30px;
            overflow-y: auto;
        }
        .page-lesson-detail .topics-label {
            padding: 0 22px 12px !important;
            color: var(--ink-3);
            font-size: .72rem !important;
            letter-spacing: 0;
        }
        .page-lesson-detail .topic-item {
            min-height: 42px;
            margin: 1px 10px;
            padding: 9px 12px !important;
            border: 0 !important;
            border-radius: 5px;
            color: var(--ink-2);
            font-size: .84rem !important;
        }
        .page-lesson-detail .topic-item.sub {
            padding-left: 25px !important;
            color: var(--ink-3);
            font-size: .78rem !important;
        }
        .page-lesson-detail .topic-item.active {
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 750;
        }
        .page-lesson-detail .topic-item.done .topic-label {
            text-decoration: none;
            opacity: 1;
        }
        .page-lesson-detail .topic-check {
            width: 17px;
            height: 17px;
            background: transparent;
            color: #28c888;
            font-size: .72rem;
        }
        .lesson-stage {
            min-width: 0;
            min-height: 100vh;
            padding: 0;
            background: var(--bg-surface);
        }
        .page-lesson-detail .main-content {
            width: 100%;
            max-width: 1020px !important;
            margin: 0 auto;
            padding: 46px 42px 64px !important;
            background: transparent;
        }
        .lesson-heading-row {
            min-height: 54px;
            margin-bottom: 22px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px;
        }
        .lesson-sequence {
            display: block;
            margin-bottom: 4px;
            color: var(--accent);
            font-size: .76rem;
            font-weight: 800;
        }
        .page-lesson-detail .lesson-main-title {
            margin: 0 !important;
            color: var(--ink-1);
            font-size: 1.55rem !important;
            line-height: 1.35;
        }
        .next-lesson-link {
            min-height: 38px;
            padding: 0 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 0;
            background: transparent;
            color: var(--ink-2);
            font-size: .9rem;
            font-weight: 750;
            white-space: nowrap;
            cursor: pointer;
        }
        .next-lesson-link:hover { color: var(--accent); }
        .next-lesson-link:disabled { opacity: .35; cursor: default; }
        .lesson-watch-status {
            margin: -12px 0 24px;
            padding: 11px 14px;
            border: 1px solid var(--border-card);
            border-radius: 7px;
            background: var(--bg-section);
            color: var(--ink-2);
            font-size: .82rem;
            font-weight: 750;
        }
        .lesson-watch-status.ready {
            border-color: rgba(16,185,129,.28);
            background: rgba(16,185,129,.09);
            color: var(--success);
        }
        .page-lesson-detail .video-wrap {
            width: 100%;
            margin-bottom: 30px !important;
            aspect-ratio: 16 / 9;
            border: 1px solid #252b39;
            border-radius: 7px !important;
            background: #111722;
            box-shadow: 0 10px 24px rgba(18, 25, 39, .14);
        }
        .page-lesson-detail .video-thumb-bg {
            background: #111722;
            overflow: hidden;
        }
        .video-thumb-image {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            background: #111722;
        }
        .video-thumb-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(8,12,20,.42), transparent 36%);
            pointer-events: none;
        }
        .page-lesson-detail .play-btn {
            bottom: 24px;
            left: 24px;
            width: 44px !important;
            height: 34px !important;
            border-radius: 5px !important;
            background: var(--accent);
            box-shadow: 0 5px 14px rgba(0,0,0,.3);
        }
        .page-lesson-detail .play-btn::after {
            border-top-width: 7px;
            border-bottom-width: 7px;
            border-left-width: 12px;
        }
        .lesson-support-content {
            padding-top: 4px;
            border-top: 1px solid var(--border);
        }
        .page-lesson-detail .lesson-body {
            color: var(--ink-2);
            font-size: .9rem !important;
            line-height: 1.8;
        }
        .page-lesson-detail .lesson-body h3 {
            margin: 25px 0 10px !important;
            padding: 0;
            border: 0;
            color: var(--ink-1);
            font-size: 1rem !important;
        }
        .page-lesson-detail .code-block {
            border-radius: 6px !important;
            font-size: .78rem !important;
        }
        .page-lesson-detail .lesson-nav {
            margin-top: 32px !important;
            padding-top: 20px !important;
        }
        .page-lesson-detail .nav-btn {
            padding: 10px 14px !important;
            border-width: 1px !important;
            border-radius: 5px !important;
            font-size: .78rem !important;
        }
        .page-lesson-detail .notes-rail {
            min-width: 0;
            min-height: 100vh;
            background: var(--bg-surface);
            border-left: 1px solid var(--border);
            border-top-left-radius: 32px;
            box-shadow: -12px 0 32px rgba(28, 39, 68, .04);
            overflow: hidden;
        }
        .lesson-tools-head {
            height: 72px;
            display: grid;
            grid-template-columns: 1fr 1fr 44px;
            align-items: stretch;
            border-bottom: 1px solid var(--border);
        }
        .lesson-tool-tab,
        .lesson-tools-close {
            border: 0;
            background: transparent;
            color: var(--ink-2);
            font-size: .9rem;
            font-weight: 750;
            cursor: pointer;
        }
        .lesson-tool-tab { border-bottom: 3px solid transparent; }
        .lesson-tool-tab.active {
            color: var(--accent);
            background: var(--accent-soft);
            border-bottom-color: var(--accent);
        }
        .lesson-tools-close {
            color: var(--ink-3);
            font-size: 1.2rem;
        }
        .lesson-tool-panel { display: none; padding: 22px 18px; }
        .lesson-tool-panel.active { display: block; }
        .page-lesson-detail .notes-rail .note-panel {
            position: static;
            padding: 0;
            border: 0;
            background: transparent;
        }
        .page-lesson-detail .note-title {
            margin-bottom: 12px;
            color: var(--ink-1);
            font-size: .9rem !important;
            letter-spacing: 0;
            text-transform: none;
        }
        .page-lesson-detail .note-area {
            height: 170px !important;
            padding: 12px;
            border: 1px solid var(--border-card);
            border-radius: 5px !important;
            background: var(--bg-section);
            font-size: .82rem !important;
            outline: none;
        }
        .page-lesson-detail .note-area:focus { border-color: var(--accent); }
        .page-lesson-detail .note-save-btn {
            padding: 7px 13px;
            border-radius: 5px !important;
            font-size: .76rem !important;
        }
        .lesson-note-example {
            margin-top: 18px;
            border: 1px solid var(--border-card);
            border-radius: 6px;
            overflow: hidden;
        }
        .lesson-note-example div {
            padding: 13px 14px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: var(--ink-2);
            border-bottom: 1px solid var(--border);
            font-size: .78rem;
            line-height: 1.55;
        }
        .lesson-note-example div:last-child { border-bottom: 0; }
        .lesson-note-example time { color: var(--ink-3); font-size: .68rem; white-space: nowrap; }
        .lesson-login-note {
            padding: 24px 16px;
            color: var(--ink-3);
            background: var(--bg-section);
            border: 1px solid var(--border-card);
            border-radius: 6px;
            text-align: center;
            font-size: .82rem;
            line-height: 1.7;
        }
        .lesson-login-note a { color: var(--accent); font-weight: 750; text-decoration: none; }
        .lesson-resource-list {
            border: 1px solid var(--border-card);
            border-radius: 6px;
            overflow: hidden;
        }
        .lesson-resource-item {
            padding: 14px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            color: var(--ink-2);
            border-bottom: 1px solid var(--border);
            font-size: .8rem;
            line-height: 1.55;
        }
        .lesson-resource-item:last-child { border-bottom: 0; }
        .lesson-resource-item b { color: var(--accent); }
        .lesson-playlist-link {
            margin-top: 14px;
            min-height: 42px;
            padding: 0 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border: 1px solid var(--accent);
            border-radius: 5px;
            color: var(--accent);
            font-size: .78rem;
            font-weight: 750;
            text-decoration: none;
        }
        .lesson-playlist-link:hover { background: var(--accent-soft); }
        .lesson-tools-toggle {
            display: none;
            position: fixed;
            right: 18px;
            bottom: 24px;
            z-index: 210;
            width: 48px;
            height: 48px;
            border: 0;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-size: 1.1rem;
            box-shadow: 0 8px 20px rgba(79,85,231,.26);
        }
        @media (max-width: 1180px) {
            .page-lesson-detail .learn-wrap {
                grid-template-columns: 240px minmax(0, 1fr) !important;
            }
            .page-lesson-detail .notes-rail {
                position: fixed;
                z-index: 205;
                top: 0;
                right: -340px;
                width: 340px;
                height: 100vh;
                transition: right .22s;
                box-shadow: -10px 0 28px rgba(30,38,62,.12);
            }
            .page-lesson-detail .notes-rail.open { right: 0; }
            .lesson-tools-toggle { display: block; }
        }
        @media (max-width: 820px) {
            .page-lesson-detail .learn-wrap { display: block !important; }
            .page-lesson-detail .sidebar {
                position: fixed;

<!-- 모바일 상단바: 강의 목록으로 돌아가기 · 현재 강의명 · 목차 · 노트 -->

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <strong class="lesson-mbar-title" id="mbarTitle">강의</strong>
    <button type="button" class="lesson-mbar-btn" data-panel-toggle="sidebar" aria-controls="sidebar" aria-expanded="false">목차</button>

<div class="learn-wrap">

            <button class="lesson-tool-tab" data-panel="resources" onclick="switchToolPanel('resources', this)">강의자료</button>

                    <div><span>작성한 노트는 현재 수업별로 자동 저장됩니다.</span><time>AUTO</time></div>

<script>
(function () {
    var backdrop = document.getElementById('lessonBackdrop');
    var toggles = document.querySelectorAll('[data-panel-toggle]');
    function setOpen(id, open) {
        var panel = document.getElementById(id);
        if (!panel) return;
        panel.classList.toggle('open', open);
        toggles.forEach(function (b) {
            if (b.getAttribute('data-panel-toggle') === id) b.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
        var anyOpen = document.querySelector('#sidebar.open, #lessonTools.open');
        backdrop.hidden = !anyOpen;
    }
    function closeAll() { setOpen('sidebar', false); setOpen('lessonTools', false); }
    toggles.forEach(function (btn) {
        btn.addEventListener('click', function () {
            var id = btn.getAttribute('data-panel-toggle');
            var willOpen = !document.getElementById(id).classList.contains('open');
            closeAll();
            setOpen(id, willOpen);
        });
    });
    backdrop.addEventListener('click', closeAll);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(); });
    // 목차에서 강의를 고르면 패널을 닫아 바로 영상이 보이도록
    var topicList = document.getElementById('topicList');
    if (topicList) topicList.addEventListener('click', function () {
        if (window.matchMedia('(max-width: 820px)').matches) setTimeout(closeAll, 120);
    });
    // 앱바 제목을 사이드바의 현재 강의명과 맞춤
    var source = document.getElementById('sideCourseTitle');
    var title = document.getElementById('mbarTitle');
    function syncTitle() { title.textContent = source.textContent; }
    if (source && title) {
        syncTitle();
        new MutationObserver(syncTitle).observe(source, { childList: true, characterData: true, subtree: true });
    }
})();
</script>

<!-- 모바일 토글 버튼 -->
<button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<button class="lesson-tools-toggle" onclick="document.getElementById('lessonTools').classList.toggle('open')" aria-label="노트 및 강의자료 열기">▤</button>

<script th:inline="javascript">
const COURSES = /*[[${coursesPayload}]]*/ {};

// 서버에서 주입된 값
const initialLang      = /*[[${lang}]]*/ 'html';
// completedIndices: 서버가 주입. 비로그인 시 '__GUEST__' 문자열이 들어옴
const _rawIndices      = /*[[${completedIndices != null ? completedIndices : '__GUEST__'}]]*/ '__GUEST__';
const isLoggedIn       = (_rawIndices !== '__GUEST__');
const completedIndices = isLoggedIn ? new Set(_rawIndices) : new Set();
const csrfToken        = document.cookie.match(/XSRF-TOKEN=([^;]+)/)?.[1] || '';
// 서버 주입 노트 맵 { lessonIdx(number): content(string) }
const _rawNoteMap = /*[[${noteMap != null ? noteMap : {}}]]*/ {};
const noteMap = {};
Object.entries(_rawNoteMap).forEach(([k, v]) => { noteMap[Number(k)] = v; });

let currentLang = (initialLang && COURSES[initialLang]) ? initialLang : 'html';
let currentLesson = 0;
const watchedIndices = new Set(completedIndices);
let lessonPlayer = null;
let youtubeApiLoading = false;
let youtubeApiCallbacks = [];

function selectLang(lang, btn) {
    currentLang = lang;
    currentLesson = 0;
    document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    // URL 업데이트 (history API)
    history.replaceState(null, '', '/learn/' + lang);
    // 언어 변경 시 noteMap은 서버 재로드 없이 빈 상태로 유지 (페이지 이동으로 갱신)
    Object.keys(noteMap).forEach(k => delete noteMap[k]);
    renderTopics();
    renderLesson(0);
    document.getElementById("sidebar").classList.remove("open");
}

function renderTopics() {
    const course = COURSES[currentLang];
    const list = document.getElementById("topicList");
    list.innerHTML = course.lessons.map((l, i) => {
        const done = completedIndices.has(i);
        const isActive = i === currentLesson;
        return `
            <div class="topic-item ${l.sub ? 'sub' : ''} ${isActive ? 'active' : ''} ${done ? 'done' : ''}"
                 onclick="selectLesson(${i})" style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                <span class="topic-label">${l.label}</span>
                <span class="topic-check ${done ? 'checked' : 'unchecked'}">✓</span>
            </div>
        `;
    }).join("");
    // 진도 표시
    const done = [...Array(course.lessons.length).keys()].filter(i => completedIndices.has(i)).length;
    const total = course.lessons.length;
    const progress = total > 0 ? Math.round(done * 100 / total) : 0;
    document.querySelector('.topics-label').textContent =
        `토픽 목록 (${done}/${total} 완료)`;
    document.getElementById('sideCourseTitle').textContent = course.title;
    document.getElementById('sideCourseProgress').textContent = progress + '%';
    document.getElementById('sideCourseProgressFill').style.width = progress + '%';
}

function canProceedToNext(idx) {
    return completedIndices.has(idx) || watchedIndices.has(idx);
}

function getNextButtonLabel(idx) {
    const course = COURSES[currentLang];
    const isLast = idx === course.lessons.length - 1;
    if (!canProceedToNext(idx)) return '영상 완료 후 다음 →';
    if (isLast) return completedIndices.has(idx) ? '학습 완료' : '완료하기';
    return completedIndices.has(idx) ? '다음 강의 →' : '완료 후 다음 강의 →';
}

function getWatchStatusText(idx) {
    if (completedIndices.has(idx)) return '이미 완료한 강의입니다. 다음 강의로 이동할 수 있어요.';
    if (watchedIndices.has(idx)) return '영상 시청 완료! 다음 강의로 이동할 수 있어요.';
    return '영상을 끝까지 시청하면 다음 강의 버튼이 활성화됩니다.';
}

function updateNextControls() {
    const course = COURSES[currentLang];
    const canProceed = canProceedToNext(currentLesson);
    const isLast = currentLesson === course.lessons.length - 1;
    const nextBtn = document.getElementById('nextBtn');
    const topNextBtn = document.getElementById('topNextBtn');
    const watchStatus = document.getElementById('watchStatus');

    if (nextBtn) {
        nextBtn.disabled = !canProceed;
        nextBtn.textContent = getNextButtonLabel(currentLesson);
    }
    if (topNextBtn) {
        topNextBtn.disabled = isLast || !canProceed;
        topNextBtn.innerHTML = `${canProceed ? '다음 강의' : '영상 완료 후 다음'} <span>›</span>`;
    }
    if (watchStatus) {
        watchStatus.classList.toggle('ready', canProceed);
        watchStatus.textContent = getWatchStatusText(currentLesson);
    }
}

function markVideoWatched(idx) {
    if (idx !== currentLesson) return;
    watchedIndices.add(idx);
    updateNextControls();
}

function renderLesson(idx) {
    const course = COURSES[currentLang];
    const l = course.lessons[idx];
    currentLesson = idx;
    if (lessonPlayer && typeof lessonPlayer.destroy === 'function') {
        lessonPlayer.destroy();
        lessonPlayer = null;
    }

    document.querySelectorAll(".topic-item").forEach((el, i) => {
        el.classList.toggle("active", i === idx);
    });

    const isLastLesson = idx === course.lessons.length - 1;
    const canProceed = canProceedToNext(idx);
    const nextLabel = getNextButtonLabel(idx);

    const codeBlock = l.code ? `
        <div class="code-label">📋 예제 코드</div>
        <div class="code-block">${escHtml(l.code)}</div>
    ` : "";

    const pointsHtml = l.points ? `
        <h3>핵심 포인트</h3>
        <ul>${l.points.map(p => `<li>${p}</li>`).join("")}</ul>
    ` : "";

    document.getElementById("mainContent").innerHTML = `
        <div class="lesson-heading-row">
            <div>
                <span class="lesson-sequence">${l.label}</span>
                <h1 class="lesson-main-title">${l.title}</h1>
            </div>
            <button class="next-lesson-link" onclick="selectLesson(${idx + 1})"
                    id="topNextBtn"
                    ${isLastLesson || !canProceed ? "disabled" : ""}>
                ${canProceed ? '다음 강의' : '영상 완료 후 다음'} <span>›</span>
            </button>
        </div>

        <div class="video-wrap" id="videoWrap">
            <div class="video-thumb-bg" id="videoThumb">
                <img class="video-thumb-image"
                     src="https://i.ytimg.com/vi/${l.videoId || course.videoId}/hqdefault.jpg"
                     alt="${l.title} 영상 썸네일"
                     onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${l.videoId || course.videoId}/hqdefault.jpg';">
            </div>
            <button class="play-btn" aria-label="강의 영상 재생"
                    onclick="playVideo('${l.videoId || course.videoId}', ${idx}, ${Number(l.videoStart || course.videoStart || 0)}, '${course.playlistId || ''}', ${Number(l.playlistIndex || idx + 1)})"></button>
        </div>
        <div class="lesson-watch-status ${canProceed ? 'ready' : ''}" id="watchStatus">
            ${getWatchStatusText(idx)}
        </div>

        <div class="lesson-support-content">
            <div class="lesson-body">
                <h3>강의 소개</h3>
                <p>${l.desc}</p>
                ${pointsHtml}
                ${codeBlock}
            </div>

            <div class="lesson-nav">
                <button class="nav-btn"
                    onclick="selectLesson(${idx - 1})"
                    ${idx === 0 ? "disabled" : ""}>
                    ← 이전 강의
                </button>
                <button class="nav-btn next" id="nextBtn"
                    onclick="completeAndNext(${idx})"
                    ${canProceed ? "" : "disabled"}>
                    ${nextLabel}
                </button>
            </div>
        </div>
    `;

    window.scrollTo({ top: 0, behavior: "smooth" });
    renderLessonResources(l);

    // 노트 패널 로드
    if (isLoggedIn) {
        const noteArea = document.getElementById('note-area');
        const noteStatus = document.getElementById('note-status');
        if (noteArea) {
            noteArea.value = noteMap[idx] || '';
            if (noteStatus) noteStatus.textContent = '';
        }
    }
}

function renderLessonResources(lesson) {
    const resourceList = document.getElementById('lessonResourceList');
    if (!resourceList) return;
    const course = COURSES[currentLang];
    const resources = lesson.points && lesson.points.length
        ? lesson.points
        : [lesson.desc, '영상 시청 후 강의 완료 버튼을 눌러 진도를 기록해보세요.'];
    const originalUrl = lesson.youtubeUrl || course.playlistUrl || '';
    resourceList.innerHTML = resources.map((item, index) => `
        <div class="lesson-resource-item">
            <b>${String(index + 1).padStart(2, '0')}</b>
            <span>${item}</span>
        </div>
    `).join('') + (originalUrl ? `
        <a class="lesson-playlist-link" href="${originalUrl}" target="_blank" rel="noopener">
            <span>생활코딩 YouTube 재생목록에서 보기</span>
            <span>↗</span>
        </a>
    ` : '');
}

function switchToolPanel(panel, button) {
    document.querySelectorAll('.lesson-tool-tab').forEach(tab => {
        tab.classList.toggle('active', tab === button);
    });
    document.querySelectorAll('.lesson-tool-panel').forEach(item => {
        item.classList.toggle('active', item.id === 'tool-' + panel);
    });
}

function ensureYouTubeApi(callback) {
    if (window.YT && window.YT.Player) {
        callback();
        return;
    }

    youtubeApiCallbacks.push(callback);
    if (youtubeApiLoading) return;

    youtubeApiLoading = true;
    window.onYouTubeIframeAPIReady = function () {
        youtubeApiLoading = false;
        const callbacks = youtubeApiCallbacks.slice();
        youtubeApiCallbacks = [];
        callbacks.forEach(cb => cb());
    };

    const script = document.createElement('script');
    script.src = 'https://www.youtube.com/iframe_api';
    script.async = true;
    document.head.appendChild(script);
}

function playVideo(videoId, idx, start = 0, playlistId = '', playlistIndex = 1) {
    const wrap = document.getElementById('videoWrap');
    if (!wrap || !videoId) return;
    wrap.innerHTML = '<div id="lessonYoutubePlayer" style="position:absolute;inset:0;width:100%;height:100%;"></div>';

    ensureYouTubeApi(function () {
        if (lessonPlayer && typeof lessonPlayer.destroy === 'function') {
            lessonPlayer.destroy();
        }

        const playerVars = {
            autoplay: 1,
            rel: 0,
            playsinline: 1,
            origin: window.location.origin
        };
        if (Number(start) > 0) playerVars.start = Number(start);

        lessonPlayer = new YT.Player('lessonYoutubePlayer', {
            videoId: videoId,
            playerVars: playerVars,
            events: {
                onStateChange: function (event) {
                    if (event.data === YT.PlayerState.ENDED) {
                        markVideoWatched(idx);
                    }
                }
            }
        });
    });
}

function selectLesson(idx) {
    const course = COURSES[currentLang];
    if (idx < 0 || idx >= course.lessons.length) return;
    renderLesson(idx);
}

async function completeAndNext(idx) {
    const course = COURSES[currentLang];
    const btn = document.getElementById('nextBtn');
    if (!canProceedToNext(idx)) {
        showWatchRequiredToast();
        updateNextControls();
        return;
    }
    if (btn) { btn.disabled = true; btn.textContent = '저장 중...'; }

    if (isLoggedIn && !completedIndices.has(idx)) {
        try {
            const csrfToken = document.querySelector('meta[name="_csrf"]')?.content || '';
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN';
            const res = await fetch(`/api/learn/${currentLang}/complete`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
                body: JSON.stringify({ lessonIdx: idx })
            });
            if (res.ok) {
                completedIndices.add(idx);
                renderTopics();
            }
        } catch (e) { console.error(e); }
    }

    if (idx < course.lessons.length - 1) {
        selectLesson(idx + 1);
    } else {
        showCompleteToast(false, idx);
        if (btn) { btn.disabled = false; btn.textContent = getNextButtonLabel(idx); }
    }
}

function showWatchRequiredToast() {
    const existing = document.getElementById('complete-toast');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.id = 'complete-toast';
    toast.style.cssText = `
        position:fixed; bottom:32px; left:50%; transform:translateX(-50%);
        background:var(--ink-1); color:#fff; border-radius:16px;
        padding:16px 24px; font-weight:800; font-size:.92rem;
        box-shadow:0 8px 24px rgba(0,0,0,0.3); z-index:9999;
    `;
    toast.textContent = '영상을 끝까지 시청하면 다음 강의로 이동할 수 있어요.';
    document.body.appendChild(toast);
    setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3000);
}

function showCompleteToast(hasNext, lessonIdx) {
    const existing = document.getElementById('complete-toast');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.id = 'complete-toast';
    toast.style.cssText = `
        position:fixed; bottom:32px; left:50%; transform:translateX(-50%);
        background:var(--ink-1); color:#fff; border-radius:16px;
        padding:16px 28px; font-weight:700; font-size:.95rem;
        box-shadow:0 8px 24px rgba(0,0,0,0.3); z-index:9999;
        display:flex; align-items:center; gap:14px;
        animation: slideUp .3s ease;
    `;

    if (hasNext) {
        toast.innerHTML = `
            <span>✅ 강의 완료!</span>
            <button onclick="selectLesson(${lessonIdx + 1}); this.closest('#complete-toast').remove();"
                style="background:var(--accent); color:#fff; border:none; border-radius:10px;
                       padding:8px 18px; font-weight:800; cursor:pointer; white-space:nowrap;">
                다음 강의 →
            </button>
            <button onclick="this.closest('#complete-toast').remove();"
                style="background:rgba(255,255,255,0.15); color:#fff; border:none; border-radius:10px;
                       padding:8px 14px; font-weight:700; cursor:pointer;">✕</button>
        `;
    } else {
        toast.innerHTML = `
            <span>🎉 이 언어의 모든 강의를 완료했어요!</span>
            <a href="/learn" style="background:var(--accent); color:#fff; border-radius:10px;
                       padding:8px 18px; font-weight:800; text-decoration:none; white-space:nowrap;">
                학습 목록으로
            </a>
            <button onclick="this.closest('#complete-toast').remove();"
                style="background:rgba(255,255,255,0.15); color:#fff; border:none; border-radius:10px;
                       padding:8px 14px; font-weight:700; cursor:pointer;">✕</button>
        `;
    }

    document.body.appendChild(toast);
    setTimeout(() => { if (toast.parentNode) toast.remove(); }, 6000);
}



async function saveNote() {
    if (!isLoggedIn) return;
    const noteArea = document.getElementById('note-area');
    const noteStatus = document.getElementById('note-status');
    const saveBtn = document.getElementById('note-save-btn');
    if (!noteArea) return;

    const content = noteArea.value;
    const lessonIdx = currentLesson;

    if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '저장 중...'; }
    if (noteStatus) noteStatus.textContent = '';

    try {
        const csrfMeta = document.querySelector('meta[name="_csrf"]')?.content || csrfToken;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN';
        const res = await fetch(`/api/learn/${currentLang}/note`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfMeta },
            body: JSON.stringify({ lessonIdx, content })
        });
        if (res.ok) {
            noteMap[lessonIdx] = content;
            if (noteStatus) {
                noteStatus.textContent = '✓ 저장됨';
                noteStatus.style.color = 'var(--success)';
            }
        } else {
            if (noteStatus) { noteStatus.textContent = '저장 실패'; noteStatus.style.color = 'var(--danger)'; }
        }
    } catch (e) {
        if (noteStatus) { noteStatus.textContent = '저장 실패'; noteStatus.style.color = 'var(--danger)'; }
    } finally {
        if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '저장'; }
        setTimeout(() => { if (noteStatus) noteStatus.textContent = ''; }, 3000);
    }
}

// 노트 textarea blur 시 자동저장 (디바운스)
let _noteDebounce = null;
document.addEventListener('DOMContentLoaded', () => {
    const noteArea = document.getElementById('note-area');
    if (noteArea) {
        noteArea.addEventListener('input', () => {
            clearTimeout(_noteDebounce);
            _noteDebounce = setTimeout(saveNote, 1500);
        });
    }
});

function escHtml(str) {
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// 초기 렌더링 - 서버에서 지정한 언어로 시작
const activeBtn = document.querySelector(`.lang-btn[data-lang="${currentLang}"]`);
if (activeBtn) activeBtn.classList.add("active");
renderTopics();
renderLesson(0);
