<!DOCTYPE html>
<html lang="ko" data-theme="light" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <script>(function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>커뮤니티 글쓰기 - CodeEdu</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/tailwind.css">
    <link rel="stylesheet" href="/css/design-refresh.css">
    <style>
        .course-page-heading { max-width: 800px; }
        .write-container {
            max-width: 800px; margin: 0 auto; background: var(--bg-surface);
            border-radius: 8px; padding: 40px; box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-card);
        }
        .write-header { margin-bottom: 32px; padding-bottom: 24px; border-bottom: 2px dashed var(--border-card); }
        .write-header h2 { font-size: 1.7rem; font-weight: 900; color: var(--ink-1); letter-spacing: -0.01em; }
        .write-header p { font-size: .95rem; color: var(--ink-2); margin-top: 8px; }
        
        .form-group { margin-bottom: 28px; }
        .form-group label { display: block; font-size: .88rem; font-weight: 800; color: var(--ink-2); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.02em; }
        .form-control {
            width: 100%; padding: 12px 16px; border-radius: 6px; border: 1px solid var(--border-card);
            font-size: 1rem; transition: all .2s; outline: none; font-family: inherit; background: var(--bg-section); color: var(--ink-1);
        }
        .form-control:focus { border-color: var(--accent); background: var(--bg-surface); box-shadow: 0 0 0 3px var(--accent-soft); }
        select.form-control { appearance: none; background: var(--bg-section) url('data:image/svg+xml;utf8,<svg fill="%2364748b" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>') no-repeat right 12px center; background-size: 20px; }
        textarea.form-control { min-height: 350px; resize: vertical; line-height: 1.6; }
        
        .btn-group { display: flex; gap: 12px; justify-content: flex-end; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border); }
        .btn-cancel {
            background: var(--bg-surface); color: var(--ink-2); border: 1px solid var(--border-card);
            padding: 11px 24px; border-radius: 6px; font-size: .95rem; font-weight: 700;
            cursor: pointer; text-decoration: none; transition: all .2s;
        }
        .btn-cancel:hover { background: var(--bg-section); border-color: var(--ink-3); color: var(--ink-1); }
        .btn-submit {
            background: var(--accent); color: #fff; border: 1px solid var(--accent);
            padding: 11px 30px; border-radius: 6px; font-size: .95rem; font-weight: 800;
            cursor: pointer; transition: all .2s;
            box-shadow: 0 4px 12px rgba(79,85,231,0.2);
        }
        .btn-submit:hover { background: var(--accent-h); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(79,85,231,0.3); }
    </style>
</head>
<body class="page-courses">
<div class="course-app-shell">
    <aside class="course-sidebar">
        <a href="/" class="course-side-logo">
            <span class="brand-text"><b>Coding</b>Edu</span>
        </a>

        <nav class="course-side-nav" aria-label="주요 메뉴">
            <a href="/"><img src="/images/course-menu/home.png" alt="" aria-hidden="true">홈</a>
            <a href="/learn"><img src="/images/course-menu/courses.png" alt="" aria-hidden="true">강의</a>
            <a href="/quiz"><img src="/images/course-menu/quiz.png" alt="" aria-hidden="true">퀴즈</a>
            <a href="/challenge"><img src="/images/course-menu/challenge.png" alt="" aria-hidden="true">챌린지</a>
            <a href="/community" class="active"><img src="/images/course-menu/community.png" alt="" aria-hidden="true">커뮤니티</a>
            <a href="/ai"><img src="/images/course-menu/ai.svg" alt="" aria-hidden="true">AI 도우미</a>
            <a href="/mypage"><img src="/images/course-menu/mypage.png" alt="" aria-hidden="true">마이페이지</a>
            <a href="/settings"><img src="/images/course-menu/settings.png" alt="" aria-hidden="true">설정</a>
        </nav>

        <div class="course-side-account">
            <a href="/login" sec:authorize="isAnonymous()">로그인</a>
            <a href="/register" sec:authorize="isAnonymous()" class="primary">회원가입</a>
            <a href="/mypage" sec:authorize="isAuthenticated()" class="primary">내 학습 기록</a>
        </div>
    </aside>

    <main class="course-page-main">
        <header class="course-page-heading">
            <div>
                <span class="course-page-kicker">COMMUNITY</span>
                <h1>새 글 작성</h1>
                <p>에러 질문, 유용한 팁, 스터디 모집 등 자유롭게 글을 남겨주세요.</p>
            </div>
            <button class="course-theme-button" id="themeToggle" title="테마 전환" aria-label="다크/라이트 모드 전환"></button>
        </header>

        <div class="write-container reveal">

    <form th:action="@{/community/write}" method="POST">
        <!-- 카테고리 선택 -->
        <div class="form-group">
            <label for="category">카테고리</label>
            <select id="category" name="category" class="form-control" required>
                <option value="qna">💡 에러/질문 (Q&A)</option>
                <option value="tips">🔥 꿀팁/노하우</option>
                <option value="study">📚 스터디 모집</option>
                <option value="free">☕ 자유게시판</option>
            </select>
        </div>

        <!-- 제목 입력 -->
        <div class="form-group">
            <label for="title">제목</label>
            <input type="text" id="title" name="title" class="form-control" placeholder="글 제목을 입력해주세요" required autofocus>
        </div>

        <!-- 내용 입력 -->
        <div class="form-group">
            <label for="content">내용</label>
            <textarea id="content" name="content" class="form-control" placeholder="이곳에 알찬 내용을 작성해주세요. (질문할 땐 에러 로그나 코드 조각을 포함해주시면 좋아요!)" required></textarea>
        </div>
        
        <div class="btn-group">
            <a href="/community" class="btn-cancel">취소</a>
            <button type="submit" class="btn-submit">등록하기</button>
        </div>
    </form>
        </div>
    </main>
</div>

<script src="/js/nav.js"></script>

</body>
</html>
