<!DOCTYPE html>
<html lang="ko" data-theme="light" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <script>(function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>알림 - CodeEdu</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/tailwind.css">
    <link rel="stylesheet" href="/css/design-refresh.css">
    <link rel="stylesheet" href="/css/site-nav.css">
    <link rel="stylesheet" href="/css/mobile.css">
    <style>
        .page-notifications .course-page-heading,
        .notif-wrap { max-width: 720px; margin-left: auto; margin-right: auto; }
        .notif-wrap { padding: 0; } /* common.css의 section 여백 무시 */
        .notif-summary { margin: 0 0 12px; color: var(--ink-2); font-size: .92rem; }
        .notif-summary b { color: var(--accent); }
        .notif-list {
            list-style: none; margin: 0; padding: 0; overflow: hidden;
            background: var(--bg-surface); border: 1px solid var(--border-card); border-radius: 16px;
        }
        .notif-list li + li { border-top: 1px solid var(--border-card); }
        .notif-item {
            position: relative; display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 14px; align-items: start;
            padding: 16px 18px; color: var(--ink-1); text-decoration: none; transition: background-color .2s ease;
        }
        a.notif-item:hover { background: var(--bg-section); }
        .notif-item.is-new { background: var(--accent-soft); }
        .notif-icon {
            width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%;
            background: #ecedff; color: #4f55e7;
        }
        .notif-icon svg { width: 21px; height: 21px; }
        .notif-icon.is-comment { background: #e2f6ee; color: #0f9f6e; }
        .notif-icon.is-like { background: #ffe8ee; color: #e11d48; }
        .notif-icon.is-challenge { background: #fff2dc; color: #d97706; }
        .notif-body { min-width: 0; display: grid; gap: 5px; padding-top: 2px; }
        .notif-msg { font-size: .95rem; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; }
        .notif-meta { color: var(--ink-3); font-size: .8rem; }
        .notif-dot { width: 8px; height: 8px; margin-top: 8px; border-radius: 50%; background: #4f55e7; }
        .notif-empty {
            display: grid; justify-items: center; gap: 8px; padding: 56px 24px; text-align: center;
            background: var(--bg-surface); border: 1px solid var(--border-card); border-radius: 16px;
        }
        .notif-empty-icon { width: 64px; height: 64px; display: grid; place-items: center; margin-bottom: 6px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }
        .notif-empty-icon svg { width: 30px; height: 30px; }
        .notif-empty strong { font-size: 1.05rem; }
        .notif-empty p { margin: 0; color: var(--ink-3); font-size: .9rem; }
        .notif-empty-btn {
            margin-top: 12px; padding: 11px 20px; border-radius: 999px;
            background: var(--accent); color: #fff; font-size: .9rem; font-weight: 750; text-decoration: none;
        }
        [data-theme="dark"] .notif-icon { background: rgba(139, 143, 255, .16); color: #a5a8ff; }
        [data-theme="dark"] .notif-icon.is-comment { background: rgba(16, 185, 129, .16); color: #34d399; }
        [data-theme="dark"] .notif-icon.is-like { background: rgba(244, 63, 94, .16); color: #fb7185; }
        [data-theme="dark"] .notif-icon.is-challenge { background: rgba(245, 158, 11, .16); color: #fbbf24; }
        [data-theme="dark"] .notif-dot { background: #8b8fff; }
        @media (max-width: 640px) {
            .notif-summary { margin: 4px 2px 10px; font-size: .88rem; }
            .notif-list, .notif-empty { border-radius: var(--m-radius); box-shadow: var(--m-shadow); }
            .notif-item { grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; padding: 14px 16px; }
            .notif-icon { width: 40px; height: 40px; }
            .notif-msg { font-size: .92rem; }
            a.notif-item:active { background: var(--bg-section); }
        }
    </style>
</head>
<body class="page-courses page-notifications">
<nav th:replace="~{index :: nav}"></nav>

    <main class="course-page-main">
        <!-- 모바일 앱 바 뒤로가기: 이전 화면이 없으면 홈으로 -->
        <a href="/" data-appbar-back hidden>홈</a>
        <header class="course-page-heading">
            <div>
                <span class="course-page-kicker">NOTIFICATIONS</span>
                <h1>알림</h1>
                <p>내 글에 달린 댓글 같은 새 소식을 모아서 보여드려요.</p>
            </div>
        </header>

        <section class="notif-wrap" aria-label="알림 목록">
            <div th:if="${notifications.isEmpty()}" class="notif-empty">
                <span class="notif-empty-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5a6 6 0 0 1 12 0c0 6.5 2.5 8.5 2.5 8.5h-17S6 15 6 8.5"/><path d="M10.2 20.5a2 2 0 0 0 3.6 0"/></svg>
                </span>
                <strong>아직 알림이 없어요</strong>
                <p>커뮤니티에 쓴 글에 댓글이 달리면 여기에서 알려드려요.</p>
                <a href="/community" class="notif-empty-btn">커뮤니티 둘러보기</a>
            </div>

            <th:block th:unless="${notifications.isEmpty()}">
                <p class="notif-summary" th:if="${!unreadIds.isEmpty()}">
                    새 알림 <b th:text="${unreadIds.size()}">2</b>개가 있어요
                </p>
                <ul class="notif-list">
                    <li th:each="n : ${notifications}" th:with="isNew=${unreadIds.contains(n.id)}">
                        <a class="notif-item" th:classappend="${isNew} ? ' is-new'"
                           th:href="${n.postId != null ? '/community/' + n.postId : null}">
                            <span class="notif-icon" th:classappend="${n.type != null} ? ' is-' + ${#strings.toLowerCase(n.type)}" th:switch="${n.type}">
                                <svg th:case="'COMMENT'" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3 20.5l1.4-5.2A8.5 8.5 0 1 1 21 11.5z"/></svg>
                                <svg th:case="'LIKE'" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-9.3-9.2C1.5 7.6 3.6 4.5 7 4.5c2 0 3.5 1.1 5 3 1.5-1.9 3-3 5-3 3.4 0 5.5 3.1 4.3 6.3C19.5 15.4 12 20 12 20z"/></svg>
                                <svg th:case="'CHALLENGE'" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
                                <svg th:case="*" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5a6 6 0 0 1 12 0c0 6.5 2.5 8.5 2.5 8.5h-17S6 15 6 8.5"/><path d="M10.2 20.5a2 2 0 0 0 3.6 0"/></svg>
                            </span>
                            <span class="notif-body">
                                <span class="notif-msg" th:text="${n.message}">알림 내용</span>
                                <span class="notif-meta">
                                    <span th:text="${n.type == 'COMMENT' ? '댓글' : n.type == 'LIKE' ? '좋아요' : n.type == 'CHALLENGE' ? '챌린지' : '알림'}">댓글</span> ·
                                    <time th:datetime="${n.createdAt}" th:text="${#temporals.format(n.createdAt, 'MM.dd HH:mm')}">01.01 12:00</time>
                                </span>
                            </span>
                            <span class="notif-dot" th:if="${isNew}" role="img" aria-label="새 알림"></span>
                        </a>
                    </li>
                </ul>
            </th:block>
        </section>
    </main>

<script src="/js/nav.js"></script>

</body>
</html>
