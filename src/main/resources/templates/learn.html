<!DOCTYPE html>
<html lang="ko" data-theme="light" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <script>(function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta th:name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta th:name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>강의 - CodeEdu</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/tailwind.css">
    <link rel="stylesheet" href="/css/design-refresh.css">
</head>
<body class="page-courses">
<div class="course-app-shell">
    <aside class="course-sidebar">
        <a href="/" class="course-side-logo">
            <span class="brand-text"><b>Coding</b>Edu</span>
        </a>

        <nav class="course-side-nav" aria-label="주요 메뉴">
            <a href="/"><img src="/images/course-menu/home.png" alt="" aria-hidden="true">홈</a>
            <a href="/learn" class="active"><img src="/images/course-menu/courses.png" alt="" aria-hidden="true">강의</a>
            <a href="/quiz"><img src="/images/course-menu/quiz.png" alt="" aria-hidden="true">퀴즈</a>
            <a href="/challenge"><img src="/images/course-menu/challenge.png" alt="" aria-hidden="true">챌린지</a>
            <a href="/community"><img src="/images/course-menu/community.png" alt="" aria-hidden="true">커뮤니티</a>
            <a href="/ai"><img src="/images/course-menu/ai.svg" alt="" aria-hidden="true">AI 도우미</a>
            <a href="/mypage"><img src="/images/course-menu/mypage.png" alt="" aria-hidden="true">마이페이지</a>
            <a href="/settings"><img src="/images/course-menu/settings.png" alt="" aria-hidden="true">설정</a>
        </nav>

        <div class="course-side-account">
            <a href="/login" sec:authorize="isAnonymous()">로그인</a>
            <a href="/register" sec:authorize="isAnonymous()" class="primary">회원가입</a>
            <a href="/mypage" sec:authorize="isAuthenticated()" class="primary">내 학습 기록</a>
        </div>
    </aside>

    <main class="course-page-main">
        <header class="course-page-heading">
            <div>
                <span class="course-page-kicker">COURSES</span>
                <h1>강의</h1>
                <p>생활코딩 강의로 웹 개발의 기초부터 차근차근 배워보세요.</p>
            </div>
            <button class="course-theme-button" id="themeToggle" title="테마 전환" aria-label="다크/라이트 모드 전환"></button>
        </header>

        <div class="course-page-grid">
            <section class="course-catalog-v2">
                <div class="course-tabs" role="tablist" aria-label="강의 필터">
                    <button class="course-tab active" data-filter="all">전체</button>
                    <button class="course-tab" data-filter="html,css,javascript">웹 기초</button>
                    <button class="course-tab" data-filter="react,nextjs">프론트엔드</button>
                    <button class="course-tab" data-filter="java,php,python">프로그래밍</button>
                    <button class="course-tab" data-filter="mysql,sqljoin">데이터베이스</button>
                    <button class="course-tab" data-filter="git">개발 도구</button>
                </div>

                <div class="course-grid-v2">
                    <a th:each="c : ${courses}"
                       th:href="@{/learn/{lang}(lang=${c.lang})}"
                       class="course-card-v2"
                       th:classappend="' course-' + ${c.lang}"
                       th:attr="data-course-type=${c.lang}">
                        <button class="course-favorite"
                                th:attr="data-lang=${c.lang}"
                                th:text="${favoriteLangs.contains(c.lang) ? '♥' : '♡'}"
                                onclick="event.preventDefault(); event.stopPropagation(); toggleFavorite(this);"
                                title="즐겨찾기"></button>
                        <div class="course-thumbnail course-youtube-thumbnail"
                             th:with="courseVideoId=${courseVideoIds[c.lang]}"
                             th:classappend="${courseVideoId == null or #strings.isEmpty(courseVideoId)} ? ' course-thumbnail-fallback' : ''">
                            <img th:if="${courseVideoId != null and not #strings.isEmpty(courseVideoId)}"
                                 th:src="|https://i.ytimg.com/vi/${courseVideoId}/maxresdefault.jpg|"
                                 th:attr="data-fallback-src=|https://i.ytimg.com/vi/${courseVideoId}/hqdefault.jpg|"
                                 th:alt="${c.title} + ' 유튜브 썸네일'"
                                 loading="lazy">
                            <span class="course-play-badge"
                                  th:if="${courseVideoId != null and not #strings.isEmpty(courseVideoId)}"
                                  aria-hidden="true"></span>
                            <span class="course-language-mark"
                                  th:if="${courseVideoId == null or #strings.isEmpty(courseVideoId)}"
                                  th:text="${c.lang == 'javascript' ? 'JS' : #strings.toUpperCase(c.lang)}">HTML</span>
                            <span class="course-thumbnail-code"
                                  th:if="${courseVideoId == null or #strings.isEmpty(courseVideoId)}"
                                  th:text="${c.lang == 'html' ? '< / >' : c.lang == 'css' ? '{ }' : '( ) =>'}">&lt; / &gt;</span>
                        </div>
                        <div class="course-card-body" th:with="done=${completedCounts[c.lang] ?: 0}, percent=${c.lessonCount > 0 ? done * 100 / c.lessonCount : 0}">
                            <h2 th:text="${c.title}">강의명</h2>
                            <p th:text="${c.description}">강의 설명</p>
                            <div class="course-progress-copy">
                                <span>진도율</span>
                                <strong th:text="${percent} + '%'">0%</strong>
                            </div>
                            <div class="course-progress-track"><i th:style="'width:' + ${percent} + '%'"></i></div>
                        </div>
                    </a>
                </div>

                <div class="course-empty" id="courseEmpty">
                    <strong>해당 강의가 아직 준비 중입니다.</strong>
                    <span>다른 카테고리의 강의를 먼저 둘러보세요.</span>
                </div>
            </section>

            <aside class="course-progress-panel">
                <span class="course-page-kicker">MY LEARNING</span>
                <h2>학습 현황</h2>
                <div class="course-progress-ring" th:style="'--progress:' + ${progressPercent} + '%'">
                    <div><span>전체 진도율</span><strong th:text="${progressPercent} + '%'">0%</strong></div>
                </div>
                <dl>
                    <div><dt>전체 강의</dt><dd th:text="${courses.size()} + '개'">3개</dd></div>
                    <div><dt>수강 중 강의</dt><dd th:text="${activeCourseCount} + '개'">0개</dd></div>
                    <div><dt>완료한 강의</dt><dd th:text="${completedCourseCount} + '개'">0개</dd></div>
                    <div><dt>완료한 수업</dt><dd th:text="${completedLessons} + '/' + ${totalLessons}">0/0</dd></div>
                </dl>
                <a href="/mypage" class="course-record-button">학습 기록 보기</a>
            </aside>
        </div>
    </main>
</div>

<script src="/js/nav.js"></script>
<script>
    const courseTabs = document.querySelectorAll('.course-tab');
    const courseCards = document.querySelectorAll('.course-card-v2');
    const courseEmpty = document.getElementById('courseEmpty');

    document.querySelectorAll('.course-youtube-thumbnail img[data-fallback-src]').forEach(img => {
        img.addEventListener('error', function handleThumbnailError() {
            this.removeEventListener('error', handleThumbnailError);
            if (this.dataset.fallbackSrc) this.src = this.dataset.fallbackSrc;
        });
    });

    courseTabs.forEach(tab => {
        tab.addEventListener('click', function () {
            courseTabs.forEach(item => item.classList.remove('active'));
            this.classList.add('active');
            const filter = this.dataset.filter;
            const filterTypes = filter === 'all' ? [] : filter.split(',').map(type => type.trim());
            let visible = 0;
            courseCards.forEach(card => {
                const show = filter === 'all' || filterTypes.includes(card.dataset.courseType);
                card.hidden = !show;
                if (show) visible++;
            });
            courseEmpty.classList.toggle('visible', visible === 0);
        });
    });

    async function toggleFavorite(btn) {
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.content || '';
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN';
        try {
            const res = await fetch(`/api/learn/${btn.dataset.lang}/favorite`, {
                method: 'POST',
                headers: { [csrfHeader]: csrfToken }
            });
            if (res.status === 401 || res.status === 403) {
                alert('로그인이 필요합니다.');
                return;
            }
            const data = await res.json();
            if (data.success) btn.textContent = data.favorite ? '♥' : '♡';
        } catch (error) {
            console.error(error);
        }
    }
</script>
</body>
</html>
